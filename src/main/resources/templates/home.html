<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ColorPrint</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/lux/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">COLORPRINT DASHBOARD</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-dark border-white">Salir</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-th-large"></i> Categorías</h2>
        <a href="/nuevo" class="btn btn-dark"><i class="fas fa-plus"></i> Nuevo Producto</a>
    </div>

    <div class="row">
        <div class="col-md-4 col-sm-6 mb-4" th:each="cat : ${categorias}">
            <div class="card shadow-sm h-100 hover-shadow">
                <div class="card-body text-center p-5">
                    <i class="fas fa-folder fa-4x text-warning mb-3"></i>
                    <h3 class="card-title text-uppercase fw-bold" th:text="${cat}">NOMBRE</h3>
                    <a th:href="@{/categoria/{nombre}(nombre=${cat})}" class="btn btn-outline-primary mt-3 stretched-link">Abrir Carpeta</a>
                </div>
            </div>
        </div>

        <div class="col-12" th:if="${categorias.empty}">
            <div class="alert alert-warning text-center">
                <h4>Sistema Vacío</h4>
                <p>Crea tu primer producto para generar una categoría automática.</p>
                <a href="/nuevo" class="btn btn-warning">Crear Producto</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
