<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ColorPrint</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/lux/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        body { background-color: #f8f9fa; }

        .card-category {
            border: none;
            border-radius: 15px;
            background: white;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-left: 5px solid #1a1a1a;
            overflow: hidden;
        }

        .card-category:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 28px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.05);
            border-left-color: #d39e00;
        }

        .icon-bg {
            position: absolute;
            right: -20px;
            bottom: -20px;
            font-size: 8rem;
            opacity: 0.05;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        /* Estilo para el botón de basura */
        .btn-delete-cat {
            opacity: 0.3;
            transition: opacity 0.2s;
        }
        .card-category:hover .btn-delete-cat {
            opacity: 1; /* Solo se ve bien al pasar el mouse */
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold tracking-wide" href="/">
            <i class="fas fa-print me-2"></i> COLORPRINT
        </a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm btn-outline-light rounded-pill px-3">
                <i class="fas fa-sign-out-alt me-1"></i> Salir
            </button>
        </form>
    </div>
</nav>

<div class="container animate__animated animate__fadeIn">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h2 class="fw-bold mb-0">Resumen de Inventario</h2>
            <p class="text-muted">Selecciona una categoría para gestionar stock.</p>
        </div>
        <a href="/nuevo" class="btn btn-dark btn-lg rounded-pill shadow-sm px-4">
            <i class="fas fa-plus me-2"></i> Nuevo Producto
        </a>
    </div>

    <div class="row g-4">
        <div class="col-md-4 col-sm-6" th:each="cat : ${categorias}">

            <div class="card card-category h-100 p-4 shadow-sm position-relative">
                <i class="fas fa-box-open icon-bg"></i>

                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="text-uppercase text-muted small fw-bold mb-2">Categoría</h6>
                        <h3 class="fw-bold mb-0" th:text="${cat}">NOMBRE</h3>
                    </div>

                    <a th:href="@{/categoria/eliminar/{nombre}(nombre=${cat})}"
                       class="btn btn-sm btn-outline-danger rounded-circle btn-delete-cat"
                       style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; z-index: 10;"
                       onclick="return confirm('⚠ ¿ELIMINAR CARPETA?\n\nSe borrarán TODOS los productos que contiene.\nEsta acción no se puede deshacer.')">
                        <i class="fas fa-trash-alt"></i>
                    </a>
                </div>

                <a th:href="@{/categoria/{nombre}(nombre=${cat})}" class="text-decoration-none text-dark stretched-link">
                    <div class="mt-4 d-flex justify-content-between align-items-center">
                        <span class="badge bg-dark rounded-pill">Ver Stock</span>
                        <i class="fas fa-chevron-right text-muted"></i>
                    </div>
                </a>
            </div>
        </div>

        <div class="col-12" th:if="${categorias.empty}">
            <div class="card border-0 shadow-sm text-center p-5">
                <div class="mb-3"><i class="fas fa-wind fa-3x text-muted"></i></div>
                <h4>El sistema está limpio</h4>
                <p class="text-muted">Agrega tu primer producto para comenzar.</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
