<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario ColorPrint</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/lux/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand text-uppercase fw-bold" href="/">ColorPrint Inventario</a>
        <div class="d-flex align-items-center text-white">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-dark border-white">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-lg">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h3 class="text-uppercase mb-0">Productos</h3>
            <a href="/nuevo" class="btn btn-dark"><i class="fas fa-plus"></i> Nuevo</a>
        </div>
        <div class="card-body">
            <div th:if="${productos.empty}" class="alert alert-info text-center">Inventario vacío.</div>
            <div class="table-responsive" th:unless="${productos.empty}">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th class="d-none d-sm-table-cell">Descripción</th>
                        <th>Precio</th>
                        <th class="text-center">Stock</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${productos}">
                        <td class="fw-bold text-muted" th:text="${p.id}"></td>
                        <td class="fw-bold text-nowrap" th:text="${p.nombre}"></td>
                        <td class="d-none d-sm-table-cell" th:text="${p.descripcion}"></td>
                        <td class="text-nowrap" th:text="${'$ ' + p.precio}"></td>
                        <td>
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{/producto/{id}/stock/-1(id=${p.id})}" class="btn btn-sm btn-outline-danger"><i class="fas fa-minus"></i></a>
                                <span class="badge bg-secondary p-2" th:text="${p.cantidad}" style="min-width: 40px;">0</span>
                                <a th:href="@{/producto/{id}/stock/1(id=${p.id})}" class="btn btn-sm btn-outline-success"><i class="fas fa-plus"></i></a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
