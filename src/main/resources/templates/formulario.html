<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/lux/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">ColorPrint Inventario</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h4>Registrar Producto</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/guardar}" th:object="${producto}" method="post">
                        <div class="mb-3">
                            <label>Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Descripción</label>
                            <input type="text" th:field="*{descripcion}" class="form-control">
                        </div>
                        <div class="row">
                            <div class="col mb-3">
                                <label>Precio</label>
                                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                            </div>
                            <div class="col mb-3">
                                <label>Cantidad</label>
                                <input type="number" th:field="*{cantidad}" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Guardar</button>
                        <a href="/" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
